# TEMPLATE ONLY.
# Copy to secret.yaml, replace every placeholder, and NEVER commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: database-cred
  namespace: society
type: Opaque
stringData:
  # MongoDB container initialization variables.
  # These only initialize credentials when /data/db is empty.
  MONGO_INITDB_ROOT_USERNAME: "REPLACE_WITH_MONGODB_USERNAME"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"

  # Backend connection string. Use the same MongoDB credentials above.
  MONGODB_URI: "mongodb://REPLACE_WITH_MONGODB_USERNAME:REPLACE_WITH_URL_ENCODED_PASSWORD@mongodb.society.svc.cluster.local:27017/society_db?authSource=admin"

  # Replace these with the values required by your backend.
  JWT_SECRET_STRING: "REPLACE_WITH_JWT_SECRET"
  JWT_EXPIRES_IN: "REPLACE_WITH_JWT_EXPIRY"
  SMTP_HOST: "REPLACE_WITH_SMTP_HOST"
  SMTP_PORT: "REPLACE_WITH_SMTP_PORT"
  SMTP_USER: "REPLACE_WITH_SMTP_USER"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
  CLIENT_URL: "REPLACE_WITH_FRONTEND_URL"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET_NAME: "REPLACE_WITH_S3_BUCKET"
